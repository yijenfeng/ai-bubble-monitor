<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 商業化監測 | AI Bubble Monitor</title><style>body{margin:0;background:#090f19;color:#eaf2ff;font:15px system-ui,'Noto Sans TC',sans-serif}main{max-width:1180px;margin:auto;padding:30px 16px}a{color:#67d9f5}h1{font-size:32px}p{color:#a7b9ce;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select,button{background:#182638;color:white;border:1px solid #43546a;border-radius:9px;padding:10px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px;border-bottom:1px solid #26384b;text-align:left;vertical-align:top}th{color:#91c8dd}td small{color:#93a7ba}input{width:90%;background:#152333;color:#fff;border:1px solid #405064;border-radius:6px;padding:8px}.wrap{overflow:auto;background:#111c2a;border-radius:12px}.pill{display:inline-block;border:1px solid #425970;border-radius:12px;padding:3px 8px;color:#b2c8db}footer{margin:25px 0;color:#8fa4b8}</style><main><a href="./">← 返回 AI Bubble Monitor</a><h1>AI 商業化與獲利監測</h1><p>追蹤八家公司 2023 Q4—2026 Q3。資料空白代表未披露或尚未核實，不代表零。ARR、年化營收、付費席位、部門營收及營業利益率不可直接互相比較。</p><div class="toolbar"><label>季度 <select id="q"></select></label><button id="csv">匯出 CSV</button><button id="reset">恢復預設資料</button></div><div class="wrap"><table><thead><tr><th>公司</th><th>指標與單位</th><th>數值</th><th>來源</th><th>口徑及品質</th></tr></thead><tbody id="rows"></tbody></table></div><footer>僅供研究，不構成投資建議。手動修改會保存在目前瀏覽器中；資料不會自動同步 GitHub。</footer></main><script>
const companies=[["OpenAI","年化營收（億美元）"],["Anthropic","季度營收（億美元）"],["Microsoft","M365 Copilot 付費席位（萬）"],["Salesforce","Agentforce ARR（億美元）"],["Adobe","AI-first ARR（億美元）"],["ServiceNow","AI ACV（億美元）"],["Alphabet","Google Cloud 營業利益率（%）"],["Amazon","AWS 季營收（億美元）"]];
const quarters=["2023 Q4","2024 Q1","2024 Q2","2024 Q3","2024 Q4","2025 Q1","2025 Q2","2025 Q3","2025 Q4","2026 Q1","2026 Q2","2026 Q3"];
const seed={
"Alphabet|2025 Q2":["20.74","https://www.sec.gov/Archives/edgar/data/1652044/000165204426000066/googexhibit991q22026.htm","Google Cloud 部門營業利益率，非純AI"],
"Alphabet|2025 Q3":["23.71","https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm","Google Cloud 部門營業利益率，非純AI"],
"Alphabet|2026 Q2":["35.59","https://www.sec.gov/Archives/edgar/data/1652044/000165204426000066/googexhibit991q22026.htm","Google Cloud 部門營業利益率，非純AI"],
"Alphabet|2026 Q3":["36.21","https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm","Google Cloud 部門營業利益率，非純AI"],
"Amazon|2025 Q3":["330.06","https://ir.aboutamazon.com/","AWS 部門營收，非純AI"],

};
const key="ai-commercialization-github-v1";let edits={};try{edits=JSON.parse(localStorage.getItem(key)||"{}")}catch{};const $=id=>document.getElementById(id);quarters.slice().reverse().forEach(q=>{let o=document.createElement("option");o.textContent=q;$("q").append(o)});
function data(n,q){return edits[n+"|"+q]||seed[n+"|"+q]||["","","未披露／待核實"]}function save(n,q,i,v){let d=data(n,q).slice();d[i]=v;edits[n+"|"+q]=d;localStorage.setItem(key,JSON.stringify(edits))}
function render(){let q=$("q").value;$("rows").replaceChildren();companies.forEach(([n,m])=>{let d=data(n,q),tr=document.createElement("tr");[n,m].forEach(t=>{let td=document.createElement("td");td.textContent=t;tr.append(td)});for(let i=0;i<3;i++){let td=document.createElement("td"),inp=document.createElement("input");inp.value=d[i];inp.placeholder=i===0?"未披露":i===1?"來源網址":"備註";inp.addEventListener("change",()=>save(n,q,i,inp.value));td.append(inp);tr.append(td)}$("rows").append(tr)})}
$("q").onchange=render;$("reset").onclick=()=>{if(confirm("清除本機修改並恢復預設資料？")){edits={};localStorage.removeItem(key);render()}};$("csv").onclick=()=>{let lines=[["公司","季度","指標","數值","來源","備註"],...quarters.flatMap(q=>companies.map(([n,m])=>[n,q,m,...data(n,q)]))];let csv="\ufeff"+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="ai-commercialization.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></html>
