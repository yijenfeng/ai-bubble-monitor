name: Refresh AI Bubble Monitor
on:
  schedule:
    - cron: '30 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/update_market.py'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python scripts/update_market.py
      - run: python scripts/recalculate.py
      - run: |
          git config user.name "ai-bubble-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scoreboard.json
          git diff --cached --quiet || git commit -m "data: refresh AI bubble monitor"
          git push
