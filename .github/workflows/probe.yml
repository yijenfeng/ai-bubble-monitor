name: Probe data sources
on:
  push:
    branches: [probe-sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-result.txt 2>&1
          for u in \
            "https://stats.bis.org/api/v1/data/WS_CREDIT_GAP/Q.TW.P.A.C/all?format=csv" \
            "https://stats.bis.org/api/v1/data/WS_CREDIT_GAP/Q.US.P.A.B/all?format=csv" \
            "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261022&selectType=MS&response=json" \
            "https://www.twse.com.tw/exchangeReport/MI_MARGN?response=json&date=20261022&selectType=MS" \
            "https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN" \
            "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261022&type=MS&response=json" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BOGZ1FL663067003Q" ; do
            code=$(curl -sS -L -m 30 -o /tmp/out -w "%{http_code}" "$u" || echo ERR)
            echo "== $code $(wc -c </tmp/out) $u"; head -c 900 /tmp/out | tr -d '\0'; echo; tail -c 300 /tmp/out; echo
          done
      - run: |
          git config user.name probe-bot
          git config user.email actions@users.noreply.github.com
          git add probe-result.txt
          git commit -m "probe result"
          git push
