name: Probe data sources
on:
  push:
    branches: [probe-sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-result.txt 2>&1
          for u in \
            "https://www.thetrading.tools/data/indicators/shiller-cape.csv" \
            "https://shillerdata.com/" \
            "http://www.econ.yale.edu/~shiller/data/ie_data.xls" \
            "https://img1.wsimg.com/blobby/go/e5e77e0b-59d1-44d9-ab25-4763ac982e53/downloads/ie_data.xls" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BOGZ1FL663067003Q" \
            "https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20261001&response=json" \
            "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261023&selectType=MS&response=json" \
            "https://openapi.twse.com.tw/v1/exchangeReport/FMTQIK" \
            "https://data.bis.org/topics/CREDIT_GAPS" \
            "https://stats.bis.org/api/v1/data/WS_CREDIT_GAP/Q.US.P.A.C/all?format=csv" ; do
            code=$(curl -sS -L -m 30 -o /tmp/out -w "%{http_code}" "$u" || echo ERR)
            echo "== $code $(wc -c </tmp/out) $u"; head -c 400 /tmp/out | tr -d '\0' | head -5; echo
          done
      - run: |
          git config user.name probe-bot
          git config user.email actions@users.noreply.github.com
          git add probe-result.txt
          git commit -m "probe result"
          git push
