name: Probe data sources
on:
  push:
    branches: [probe-sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: |
          set -o pipefail
          (time python scripts/update_market.py && time python scripts/research_indicators.py && python scripts/recalculate.py) 2>&1 | tee probe-result.txt
      - if: always()
        run: |
          git config user.name probe-bot
          git config user.email actions@users.noreply.github.com
          git add -A data probe-result.txt
          git commit -m "probe result"
          git push
